name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - name: Offline runs reach the expected outcomes
        run: |
          uv run nexus run fathom --fake | grep -q "outcome=remediation"
          uv run nexus run quanta --fake | grep -q "outcome=standard_offer"
